name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo contents (debug)
        run: ls -la

      - name: Unzip project if a zip was uploaded
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found zip: $ZIPFILE"
            unzip -o "$ZIPFILE" -d .
          else
            echo "No zip file found at repo root."
          fi
          echo "--- Repo contents after unzip ---"
          find . -maxdepth 3 -not -path "./.git*"

      - name: Locate project root (folder containing build.gradle)
        id: locate
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 4 -name 'build.gradle' -not -path './build.gradle' | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            # fallback: root build.gradle itself
            PROJECT_DIR="."
          fi
          echo "Project dir resolved to: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper (pinned compatible version)
        run: gradle wrapper --gradle-version 8.4
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BardiaVisualizer-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
